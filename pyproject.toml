[project]
name = "ha-difluid"
version = "1.0.0"
description = "DiFluid instruments for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.367",
  "ruff>=0.15.0",
  "mypy>=1.19.0",
  "bleak-retry-connector==4.7.0",
  "aioesphomeapi",
  "aiousbwatcher==1.1.2",
  "serialx==1.10.0",
  "bleak-esphome==4.0.0",
  "bluetooth-auto-recovery==1.6.4",
  "habluetooth==6.26.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
